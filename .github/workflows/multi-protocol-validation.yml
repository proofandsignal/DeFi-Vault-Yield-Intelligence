name: Multi Protocol Validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  multi-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EVM_RPC_URL: https://ethereum-rpc.publicnode.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Four-protocol live compatibility smoke
        run: npm run live:multi-protocol
