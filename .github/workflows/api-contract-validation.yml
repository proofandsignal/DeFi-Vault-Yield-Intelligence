name: API Contract Validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  api-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Validate scanner and API contract
        run: npm run api:contract
