name: Independent Risk Validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  risk-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Independent Ethereum USDC risk smoke
        run: npm run live:risk-smoke
