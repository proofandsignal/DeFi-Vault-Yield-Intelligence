name: Optimism Isolated Evidence Tests

on:
  pull_request:
    paths:
      - "experimental/optimism/**"
      - ".github/workflows/optimism-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run isolated OP evidence tests
        run: node --test experimental/optimism/normalize-evidence.test.mjs
